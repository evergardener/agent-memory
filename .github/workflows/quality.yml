name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-and-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.14"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --extra dev --extra migrations
      - run: uv run ruff check src integrations tests migrations scripts/predeploy_host_check.py
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          log_file="$RUNNER_TEMP/pytest.log"
          if env PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYDANTIC_DISABLE_PLUGINS=__all__ \
            uv run pytest -q 2>&1 | tee "$log_file"; then
            exit 0
          fi
          {
            echo "### pytest failure"
            echo '```text'
            tail -n 80 "$log_file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          message="$(tail -n 20 "$log_file")"
          message="${message//'%'/'%25'}"
          message="${message//$'\r'/'%0D'}"
          message="${message//$'\n'/'%0A'}"
          echo "::error title=pytest failed::$message"
          exit 1
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run check-build
      - run: bash -n scripts/*.sh

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: source-and-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      REGISTRY: ghcr.io
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/agent-memory
    steps:
      - uses: actions/checkout@v7
      - name: Read application version
        id: version
        shell: bash
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build and publish immutable multi-platform images
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            AGENT_MEMORY_BUILD_VERSION=${{ steps.version.outputs.value }}
            AGENT_MEMORY_BUILD_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-worker:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-migrate:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-api:main
            ${{ env.IMAGE_PREFIX }}-worker:main
            ${{ env.IMAGE_PREFIX }}-migrate:main
      - name: Attest API image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-api
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest worker image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-worker
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest migrate image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-migrate
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  verify-published-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-images
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/agent-memory
      HERMES_AGENT_REVISION: ca3566301373d871f05c1841dafe11cbd8e37a4d
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Exclude the pinned Hermes checkout from release cleanliness checks
        shell: bash
        run: echo "/hermes-agent-runtime/" >> "$GITHUB_WORKSPACE/.git/info/exclude"
      - name: Checkout the validated Hermes runtime
        uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_AGENT_REVISION }}
          path: hermes-agent-runtime
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.14"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install release and Hermes test runtimes
        shell: bash
        run: |
          uv sync --frozen --extra dev --extra migrations
          UV_PROJECT_ENVIRONMENT=venv uv sync \
            --directory hermes-agent-runtime \
            --frozen
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Verify and pull the exact published images
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          project="agent-memory-release-ghcr-${GITHUB_RUN_ID}"
          for service in api worker migrate; do
            image="${IMAGE_PREFIX}-${service}:sha-${GITHUB_SHA}"
            manifest="$(docker buildx imagetools inspect "$image")"
            grep -F "linux/amd64" <<<"$manifest"
            grep -F "linux/arm64" <<<"$manifest"
            gh attestation verify "oci://$image" --repo "$GITHUB_REPOSITORY"
            docker pull --platform linux/amd64 "$image"
            test "$(docker image inspect "$image" --format '{{.Architecture}}')" = amd64
            test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$version"
            test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
            docker tag "$image" "${project}-${service}:${version}"
          done
      - name: Run the complete gate against published images
        shell: bash
        run: |
          set -uo pipefail
          runtime_root="$RUNNER_TEMP/agent-memory-release-gate"
          project="agent-memory-release-ghcr-${GITHUB_RUN_ID}"
          log_file="$RUNNER_TEMP/published-image-release-gate.log"
          if (
            set -euo pipefail
            AGENT_MEMORY_RELEASE_PROJECT="$project" \
              bash scripts/init-release-env.sh \
                "$runtime_root" \
                "$runtime_root/release.env"
            env \
              AGENT_MEMORY_SKIP_BUILD=1 \
              AGENT_MEMORY_REVISION="$GITHUB_SHA" \
              HERMES_AGENT_ROOT="$GITHUB_WORKSPACE/hermes-agent-runtime" \
              bash scripts/release-check.sh "$runtime_root/release.env"
          ) 2>&1 | tee "$log_file"; then
            exit 0
          fi
          if [[ -f "$runtime_root/release.env" ]]; then
            (
              set -a
              source "$runtime_root/release.env"
              set +a
              echo "==> failed release stack status"
              docker compose \
                -f compose.yaml \
                -f compose.release.yaml \
                --env-file "$runtime_root/release.env" \
                ps --all
              echo "==> failed release stack logs"
              docker compose \
                -f compose.yaml \
                -f compose.release.yaml \
                --env-file "$runtime_root/release.env" \
                logs --no-color --tail=120 \
                  postgres migrate api worker model-worker
              for container in \
                "${AGENT_MEMORY_COMPOSE_PROJECT}-automated-test-api" \
                "${AGENT_MEMORY_COMPOSE_PROJECT}-automated-test-worker"; do
                if docker container inspect "$container" >/dev/null 2>&1; then
                  echo "==> $container logs"
                  docker logs --tail=120 "$container"
                fi
              done
            ) 2>&1 | tee -a "$log_file" || true
          fi
          {
            echo "### Published-image release gate failure"
            echo '```text'
            tail -n 80 "$log_file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          message="$(tail -n 20 "$log_file")"
          message="${message//'%'/'%25'}"
          message="${message//$'\r'/'%0D'}"
          message="${message//$'\n'/'%0A'}"
          echo "::error title=published-image release gate failed::$message"
          exit 1
      - name: Clean up the isolated release stack
        if: always()
        shell: bash
        run: |
          env_file="$RUNNER_TEMP/agent-memory-release-gate/release.env"
          if [[ -f "$env_file" ]]; then
            docker compose \
              -f compose.yaml \
              -f compose.release.yaml \
              --env-file "$env_file" \
              down --volumes --remove-orphans
          fi
